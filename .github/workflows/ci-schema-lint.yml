name: Schema Lint

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'tools/*.py'
      - 'tools/*.txt'
      - '.github/workflows/ci-schema-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'tools/*.py'
      - 'tools/*.txt'
      - '.github/workflows/ci-schema-lint.yml'


concurrency:
  group: ci-schema-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schema-lint:
    name: schema-lint
    # Needs nothing from our machine, so it runs on a hosted runner and does not queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate JSON, names and required fields
        # One process for all schemas. A process per schema took 13 minutes on the self-hosted runner.
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys
          bad = []
          for f in sorted(glob.glob("schemas/*.json")):
              base = os.path.basename(f)
              try:
                  s = json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"INVALID JSON: {f}: {e}")
                  continue
              if base.startswith("_"):
                  continue
              if not re.match(r"^[a-z][a-z0-9._-]+\.v[0-9]+\.json$", base):
                  bad.append(f"BAD NAME: {base} (must match <channel>.v<N>.json)")
              missing = [k for k in ("$id", "title", "description") if k not in s]
              if missing:
                  bad.append(f"MISSING in {f}: {missing}")
          print("\n".join(bad) or "OK: all schemas")
          sys.exit(1 if bad else 0)
          EOF

      - name: Install jsonschema
        run: python3 -m pip install --quiet jsonschema

      - name: Validate schemas as JSON Schema 2020-12
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys, glob
          from jsonschema import Draft202012Validator
          fails = []
          for f in sorted(glob.glob("schemas/*.json")):
              if f.split("/")[-1].startswith("_"):
                  continue
              try:
                  s = json.load(open(f))
                  Draft202012Validator.check_schema(s)
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"INVALID SCHEMA: {f}: {e}")
                  fails.append(f)
          if fails:
              sys.exit(f"\n{len(fails)} invalid schema(s)")
          EOF

      - name: Verify CHANNELS.md is up to date
        # schemas/CHANNELS.md is auto-generated from schemas/*.json by
        # tools/gen_channels_md.py (see that file's docstring). This is the
        # drift class from the ecosystem-audit-p2 tengine-schema-hygiene fix:
        # 19 tengine schemas were missing entirely, so CHANNELS.md silently
        # under-reported the real channel surface with no CI signal. Regenerate
        # into a scratch copy and diff against the committed file — fail the
        # build if a schema file exists (added, removed, or edited) without a
        # matching regeneration.
        run: |
          set -euo pipefail
          cp schemas/CHANNELS.md "$RUNNER_TEMP/CHANNELS.md.committed"
          python3 tools/gen_channels_md.py
          if ! diff -u "$RUNNER_TEMP/CHANNELS.md.committed" schemas/CHANNELS.md; then
            echo ""
            echo "STALE: schemas/CHANNELS.md does not match the generator output above."
            echo "Run 'python3 tools/gen_channels_md.py' and commit the result."
            exit 1
          fi
          echo "OK: schemas/CHANNELS.md is up to date"
