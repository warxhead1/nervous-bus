name: Runner Guard

# Fails when a self-hosted job could be started by a fork's pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runner-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_self_hosted_guard.py
      - run: python3 -m unittest tools/test_check_self_hosted_guard.py
