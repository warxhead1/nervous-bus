name: Portable Setup

on:
  push:
    branches: [main]
    paths:
      - 'tools/setup.py'
      - 'tools/test_setup.py'
      - 'Makefile'
      - 'adapters/transcripts/**'
      - 'adapters/argshape/**'
      - 'adapters/needs-you/**'
      - '.github/workflows/ci-portable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/setup.py'
      - 'tools/test_setup.py'
      - 'Makefile'
      - 'adapters/transcripts/**'
      - 'adapters/argshape/**'
      - 'adapters/needs-you/**'
      - '.github/workflows/ci-portable.yml'

permissions:
  contents: read

concurrency:
  group: ci-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable:
    name: portable (${{ matrix.os }}, py${{ matrix.python }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
        exclude:
          # setup-python has no 3.9 build for the current ubuntu-latest image; 3.9 is still
          # covered on macOS and Windows.
          - os: ubuntu-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Doctor
        run: python tools/setup.py doctor

      - name: Install (dry run)
        run: python tools/setup.py install --bin-dir "${{ runner.temp }}/nbus-bin" --dry-run

      - name: Portable test suites
        run: python -m pytest -q -p no:cacheprovider adapters/transcripts tools/test_setup.py
