name: Portable Setup

on:
  push:
    branches: [main]
    paths:
      - 'tools/setup.py'
      - 'tools/test_*.py'
      - 'tools/container_*.sh'
      - 'Makefile'
      - 'agent-hooks/**'
      - 'adapters/transcripts/**'
      - 'adapters/argshape/**'
      - 'adapters/needs-you/**'
      - 'steering/**'
      - '.claude-plugin/**'
      - '.github/workflows/ci-portable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/setup.py'
      - 'tools/test_*.py'
      - 'tools/container_*.sh'
      - 'Makefile'
      - 'agent-hooks/**'
      - 'adapters/transcripts/**'
      - 'adapters/argshape/**'
      - 'adapters/needs-you/**'
      - 'steering/**'
      - '.claude-plugin/**'
      - '.github/workflows/ci-portable.yml'

permissions:
  contents: read

concurrency:
  group: ci-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable:
    name: portable (linux)
    # A fork's pull request never runs on our own machine. tools/check_self_hosted_guard.py enforces this.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, nervous-bus]
    timeout-minutes: 30
    steps:
      - name: Configure PATH
        run: |
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Doctor
        run: python3 tools/setup.py doctor

      - name: Install (dry run)
        run: python3 tools/setup.py install --bin-dir "$RUNNER_TEMP/nbus-bin" --no-deps --dry-run

      - name: Portable test suites
        run: python3 tools/setup.py test

      - name: Clean-container install (debian, ubuntu)
        run: tools/container_smoke.sh
