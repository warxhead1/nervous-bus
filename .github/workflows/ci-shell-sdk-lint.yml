name: Shell SDK Lint

on:
  push:
    branches: [main]
    paths:
      - 'sdk/shell/**'
      - 'adapters/**'
      - '.github/workflows/ci-shell-sdk-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/shell/**'
      - 'adapters/**'
      - '.github/workflows/ci-shell-sdk-lint.yml'


concurrency:
  group: ci-shell-sdk-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-sdk-lint:
    name: shell-sdk-lint
    # Needs nothing from our machine, so it runs on a hosted runner and does not queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install shellcheck
        run: |
          python3 -m pip install --quiet shellcheck-py
          shellcheck --version

      - name: Lint all shell scripts under sdk/ and adapters/
        run: |
          set -euo pipefail
          # Glob-walk so new scripts are picked up automatically.
          # Uses heuristic: any file under sdk/shell/ or adapters/ that has a
          # shebang naming bash/sh, OR has a .sh extension.
          mapfile -t files < <(
            find sdk/shell adapters -type f \( -name "*.sh" -o ! -name "*.*" \) 2>/dev/null \
              | while read -r f; do
                  if [[ "$f" == *.sh ]] || head -1 "$f" 2>/dev/null | grep -qE '^#!/.*(bash|sh)\b'; then
                    echo "$f"
                  fi
                done
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found"; exit 0
          fi
          printf "Linting %d files:\n" "${#files[@]}"
          printf "  %s\n" "${files[@]}"
          shellcheck -S warning "${files[@]}"
