name: Plugin Tests

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/ci-plugin-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/ci-plugin-tests.yml'


concurrency:
  group: ci-plugin-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plugin-tests:
    name: plugin-tests
    # A fork's pull request never runs on our own machine. tools/check_self_hosted_guard.py enforces this.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, nervous-bus]
    steps:
      - name: Configure PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Install wasm32-wasip1 target, clippy and rustfmt
        run: |
          rustup target add wasm32-wasip1
          rustup component add clippy rustfmt

      - name: cargo fmt --check
        working-directory: plugin
        run: cargo fmt --check

      - name: cargo clippy (deny warnings)
        working-directory: plugin
        run: cargo clippy --no-deps --all-targets --locked -- -D warnings

      - name: Run tests (native)
        working-directory: plugin
        run: cargo test --locked

      - name: Build WASM release artifact
        working-directory: plugin
        run: cargo build --target wasm32-wasip1 --release --locked

      - name: Check Cargo.lock is up to date
        working-directory: plugin
        run: git diff --exit-code Cargo.lock
