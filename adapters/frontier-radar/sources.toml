# Frontier radar source registry. Every endpoint was fetched in the 2026-11-26 frontier research run
# unless its notes say otherwise. No source needs a paid key. Reddit is excluded (closed).
#
# kind: rss | atom | json-api | github-releases | github-search | hn-algolia | hf-daily-papers |
#       hf-models | bsky-search | sitemap-lastmod | page-diff
# role: primary = the source publishes the artifact; mirror = it links to or restates one.
# domains: harness memory research gamedev assets content ads markets models
# freshness_slo_days: alarm when the newest item is older than this.
# Optional: enabled, min_interval_minutes (default 180), host_delay_s, include_regex, exclude_regex,
#   min_engagement, path_regex, lookback_days, link_only, max_items.
# URL placeholders: {date_minus_7d} expands to a YYYY-MM-DD date.

[[source]]
id = "claude-code-releases"
