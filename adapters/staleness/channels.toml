# Per-channel staleness rules for public channels. First match wins.
# Private channels go in $NERVOUS_HOME/staleness-channels.toml, which is read first.
#
#   match          fnmatch glob over the channel name
#   kind           "activity": publishes only when there is work, so silence is normal
#                  "retired":  the producer is gone on purpose
#   min_gap_hours  the stale threshold is at least this many hours

# hearth-loom sidecars emit health only while a build or lint is running.
[[channel]]
match = "hearth-builder.*"
kind = "activity"

[[channel]]
match = "hearth-linter.*"
kind = "activity"

# hearth-loom dispatch: one event per bead step, nothing when no bead is in flight.
[[channel]]
match = "bus.bead.lifecycle.v1"
kind = "activity"

[[channel]]
match = "loom.shared-session.v1"
kind = "activity"

# kb edits made by a person or a bulk apply.
[[channel]]
match = "kb.entry.updated.v1"
kind = "activity"

[[channel]]
match = "kb.entry.archived.v1"
kind = "activity"

[[channel]]
match = "kb.entry.unarchived.v1"
kind = "activity"

[[channel]]
match = "kb.entry.moved.v1"
kind = "activity"

[[channel]]
match = "kb.entry.deleted.v1"
kind = "activity"

[[channel]]
match = "kb.entry.vetted.v1"
kind = "activity"

[[channel]]
match = "kb.entry.superseded.v1"
kind = "activity"

[[channel]]
match = "kb.related.*"
kind = "activity"

[[channel]]
match = "kb.attachment.*"
kind = "activity"

[[channel]]
match = "kb.bulk.applied.v1"
kind = "activity"

# memory graph writes from the everos watch pilot.
[[channel]]
match = "memory.node.*"
kind = "activity"

# deer-flow runs started by hand.
[[channel]]
match = "deer-flow.claim.verified.v1"
kind = "activity"

[[channel]]
match = "deer-flow.stack-tuner.stage.*"
kind = "activity"

# progress from gamedev agent sessions.
[[channel]]
match = "bus.gamedev.progress.v2"
kind = "activity"

# hearth ember insights arrive in batches hours apart.
[[channel]]
match = "hearth.ember.insight.v1"
min_gap_hours = 24
