# --- Thresholds --------------------------------------------------------------
# Every numeric limit the audit enforces is READ from a fetched source by
# regex, never typed in here. When a pattern stops matching, the audit reports
# `threshold_unresolved` — the doc's wording changed, which is itself a signal
# to re-read that section.

[[threshold]]
id = "claude_md_target_lines"
source = "cc-memory"
pattern = 'target under (\d+) lines per CLAUDE\.md file'

[[threshold]]
id = "memory_index_lines"
source = "cc-memory"
pattern = 'The first (\d+) lines of `MEMORY\.md`'

[[threshold]]
id = "memory_index_kb"
source = "cc-memory"
pattern = 'The first \d+ lines of `MEMORY\.md`, or the first (\d+)KB'

[[threshold]]
id = "skill_md_lines"
source = "cc-skills"
pattern = 'Keep `SKILL\.md` under (\d+) lines'

[[threshold]]
id = "skill_listing_desc_chars"
source = "cc-skills"
pattern = 'truncated at ([\d,]+) characters in the skill listing'

[[threshold]]
id = "import_max_hops"
source = "cc-memory"
pattern = 'maximum depth of (\w+) hops'
