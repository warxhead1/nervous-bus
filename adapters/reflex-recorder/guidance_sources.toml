# guidance_sources.toml — the external guidance the steering audit compares us against.
#
# Read by guidance_watch.py (fetch + sha256 + diff) and steering_audit.py
# (thresholds, failure-pattern crosswalk). Only sources with a stable
# machine-readable URL belong here: an `llms.txt`-indexed .md page or a raw
# file. Blogs without a feed churn URLs and make freshness unmeasurable.
#
# kind = "doc"   a page; a content change writes a unified diff.
# kind = "index" an llms.txt; a change also reports pages added/removed, which
#                is how a NEW page (a feature we have never audited) surfaces.

# --- Claude Code (code.claude.com) -----------------------------------------
