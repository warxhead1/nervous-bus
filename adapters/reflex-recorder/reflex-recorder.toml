# reflex-recorder.toml — configuration for the Reflexarc run capture adapter

[redis]
url = "redis://localhost:6379"
db = 0
connect_timeout_s = 5.0

[recorder]
# Idle timeout: close a run after this many seconds with no new events
idle_timeout_s = 900.0

# How often to log metrics to stderr
metrics_interval_s = 60.0

# How often to check for idle runs (must be << idle_timeout_s)
tick_interval_s = 30.0

# Redis XREADGROUP read parameters
stream_read_count = 200
stream_block_ms = 2000

# Wall-clock budget for the graceful-shutdown flush on SIGTERM. Must stay
# comfortably under systemd/reflex-recorder.service's TimeoutStopSec=60
# (bumped from 15 by nervous-bus#51), which SIGKILLs the unit mid-flush once
# it expires. Only the best-effort `nervous publish` fan-out is dropped when
# the budget runs out; the SQLite writes for open runs and their buffered
# events (now a single write-ahead-journaled transaction per run close, see
# store.py's pending_events table) always happen.
shutdown_budget_s = 10.0

# PEL reclaim (nervous-bus#54): on every startup, before the read loop,
# XAUTOCLAIM entries idle longer than this (from ANY consumer in the
# 'reflex-recorder' group, not just a specific dead one) onto this process
# and feed them through the same journaled ingest + XACK path as a live
# batch. See recorder.py's module docstring, "PEL reclaim" section.
reclaim_min_idle_s = 600.0

# After reclaiming, XGROUP DELCONSUMER any consumer (never this process's
# own) with zero pending entries idle longer than this — purely cosmetic
# bookkeeping so XINFO CONSUMERS doesn't accrete one row per pid forever.
reclaim_dead_consumer_idle_s = 86400.0

[store]
# SQLite database path (default: ~/.cache/nervous-bus/reflex/runs.db)
# db_path = "~/.cache/nervous-bus/reflex/runs.db"
