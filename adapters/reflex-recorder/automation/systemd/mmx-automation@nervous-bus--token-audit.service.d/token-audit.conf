# Install: symlink this dir into ~/.config/systemd/user/ (see automation/README.md).
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
# The digest is rebuilt by reflex-analysis (05:30). Refuse to audit a digest
# older than 30h: a stale input would re-propose yesterday's ranking.
ExecStartPre=/bin/bash -c 'test -n "$(find %h/.cache/nervous-bus/reflex/token-digest/latest.md -mmin -1800 2>/dev/null)" || { echo "token-audit: digest missing or older than 30h" >&2; exit 1; }'
# Host-side egress: validate the report's one proposal, file bead + issue.
ExecStartPost=%h/.pyenv/versions/3.11.13/bin/python3 %h/projects/nervous-bus/adapters/reflex-recorder/automation/token_audit_publish.py
